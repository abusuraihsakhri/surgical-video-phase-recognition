name: Tests and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Compile Python source
        run: python -m compileall -q agents surgiphase_agent cli.py enrichment.py simulator.py
      - name: Verify browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.DOTALL | re.IGNORECASE)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline browser script")
          with tempfile.TemporaryDirectory() as d:
              p = Path(d, "app.js")
              p.write_text(scripts[0], encoding="utf-8")
              subprocess.run(["node", "--check", str(p)], check=True)
          PY
      - name: Run unit and API tests
        run: python -m pytest -q
